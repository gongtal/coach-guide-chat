:root{color-scheme:light;--paper:#f8f8f4;--ink:#202e2a;--green:#175944;--quiet:#53665e;--line:#d6ded6;--u: min(900px,calc(100% - 64px));font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;word-break:keep-all;overflow-wrap:anywhere}button,textarea{font:inherit}button,summary{cursor:pointer}button{color:inherit}button:focus-visible,summary:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #ad641a;outline-offset:3px}button{touch-action:manipulation}svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.icons{position:absolute;width:0;height:0;overflow:hidden}.icon{width:21px;height:21px;flex:none}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}.skip{position:fixed;left:12px;top:-80px;background:white;padding:12px;z-index:5}.skip:focus{top:10px}[hidden]{display:none!important}.app{height:100vh;height:100dvh;height:var(--screen,100dvh);display:flex;flex-direction:column}.bar{flex:none;border-bottom:1px solid var(--line);background:#fbfcf8}.barin{margin:auto;width:min(1220px,calc(100% - 64px));display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:12px}.name{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;letter-spacing:-1.3px}.mark{width:36px;height:36px;background:var(--green);color:#e6f0c7;display:grid;place-items:center;border-radius:11px}.mark .icon{width:24px;height:24px}.tag{font-size:12px;color:var(--quiet);padding-left:13px;border-left:1px solid var(--line);letter-spacing:0;font-weight:600}.reset{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:8px 14px;display:flex;align-items:center;gap:7px;min-height:44px}.reset:hover{background:#edf2e9}.reset .icon{width:15px;height:15px}.workspace{display:flex;flex-direction:column;flex:1;min-height:0}.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable both-edges}.inner,.compose{width:var(--u);margin:auto}.intro{padding:clamp(26px,5vh,58px) 0 22px}.hero{isolation:isolate;position:relative;overflow:hidden;border-radius:22px;background:#154638;color:#f7fbf1;padding:clamp(25px,4vw,46px);min-height:216px;display:grid;align-content:center}.hero svg.art{position:absolute;right:-27px;bottom:-55px;width:42%;height:133%;color:#a2c4a8;stroke-width:1;z-index:-1;opacity:.55}.kicker{display:flex;align-items:center;gap:8px;color:#e0edb7;font-weight:650;font-size:13px;letter-spacing:.04em}.kicker:before{content:"";width:22px;height:2px;background:currentColor}.hero h1{margin:15px 0 10px;font-size:clamp(29px,3.7vw,46px);line-height:1.22;letter-spacing:-.065em}.hero p{font-size:15px;margin:0;color:#dfebe2;line-height:1.7;max-width:70%}.section-title{font-size:17px;margin:27px 0 13px;letter-spacing:-.05em}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{text-align:left;border:1px solid var(--line);padding:18px;border-radius:14px;background:#fff;display:flex;flex-direction:column;gap:11px;transition:border-color .15s,background .15s}.card:hover{background:#f1f5eb;border-color:#81a792}.ct{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--green)}.ct .icon{background:#eef3e8;border-radius:6px;padding:5px;width:26px;height:26px}.card .arr{font-size:18px;margin-left:auto;color:#658173;line-height:1}.cq{font-size:15px;line-height:1.55;font-weight:650;letter-spacing:-.045em}.thread{padding:26px 0 16px}.talkhead{font-size:14px;color:var(--quiet);margin:0 0 25px;display:flex;align-items:center;gap:12px}.talkhead:after{content:"";background:var(--line);height:1px;flex:1}.msg{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 23px;gap:7px}.msg.me{align-items:flex-end}.who{font-size:13px;font-weight:750;color:var(--green);display:flex;gap:6px;align-items:center}.who .icon{width:16px;height:16px}.bubble{border:1px solid var(--line);border-radius:0 15px 15px;background:white;padding:15px 18px;line-height:1.75;font-size:16px;max-width:96%;white-space:pre-wrap;word-break:normal}.me .bubble{border:0;background:#e6eee1;border-radius:15px 0 15px 15px}.refs{background:#f2f5ed;border:1px solid var(--line);border-radius:10px;padding:0 14px;max-width:96%;font-size:14px;line-height:1.65}.refs summary{font-weight:650;color:var(--green);padding:10px 0}.refs ol{padding-left:22px;margin:0 0 12px}.refs li+li{margin-top:10px}.refs p{margin:2px 0;white-space:pre-wrap}.fail .bubble{background:#fff7ed;border-color:#e8cfaa}.dock{flex:none;background:var(--paper);padding:12px 0 max(15px,env(safe-area-inset-bottom));box-shadow:0 -9px 14px -10px #f8f8f4}.field{border:1px solid #aabaae;border-radius:17px;box-shadow:0 4px 16px #2635290b;background:white;display:flex;gap:12px;align-items:flex-end;padding:11px}.field:focus-within{border-color:var(--green);box-shadow:0 0 0 2px #17594425}textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;color:var(--ink);line-height:1.55;padding:10px 4px 8px 7px;font-size:16px;max-height:110px;scroll-margin-bottom:10px}textarea::placeholder{color:#626f68}textarea:focus-visible{outline:0}.send{border:0;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;background:var(--green);color:white}.send:disabled{background:#dfe7dc;color:#52685a;cursor:default}.tip{font-size:12px;line-height:1.5;margin:8px 3px 0;color:var(--quiet);display:flex;justify-content:space-between;gap:8px}.pending .bubble{color:var(--quiet)}.pending .bubble:before{content:"";display:inline-block;border:2px solid #c9d8c5;border-top-color:var(--green);border-radius:50%;width:10px;height:10px;margin-right:9px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:670px){:root{--u:calc(100% - 32px)}.barin{width:var(--u);min-height:60px}.name{font-size:18px;gap:8px}.mark{width:31px;height:31px}.tag,.shortcut{display:none}.reset{font-size:12px;padding:7px 11px}.scroll{scrollbar-gutter:auto}.intro{padding:16px 0}.hero{padding:23px;min-height:174px;border-radius:16px}.hero h1{font-size:30px}.hero p{max-width:78%;font-size:14px}.hero svg.art{right:-56px;width:50%;opacity:.35}.section-title{margin:19px 0 9px;font-size:16px}.cards{grid-template-columns:1fr;gap:7px}.card{position:relative;gap:4px;padding:10px 32px 10px 13px}.ct{font-size:11px}.ct .icon{width:16px;height:16px;padding:0;background:none}.card .arr{position:absolute;right:14px;top:50%;transform:translateY(-50%)}.cq{font-size:14px}.thread{padding:20px 0 10px}.dock{padding-top:8px}.field{padding:7px;border-radius:14px}.tip{font-size:11px}.bubble{font-size:15px;padding:12px 15px}}@media(max-height:460px){.barin{min-height:45px}.tip{display:none}.dock{padding-bottom:max(5px,env(safe-area-inset-bottom))}}

<script>(()=>{
'use strict';
const guides=[{"id":"first-consult","title":"첫 상담: 오늘 결정할 질문 정하기","keywords":["첫 상담","1차 상담","초기 상담","첫 미팅","상담 준비","상황 파악"],"text":"“오늘 상담이 끝날 때 무엇을 결정할 수 있으면 좋을까요?”라고 물어보세요. ‘매출이 고민’이라는 답에는 최근 주문 한 건을 예로 들어 문의부터 입금까지 어디에서 막혔는지 짚어 보세요.\n종이에 확인한 사실, 아직 모르는 점, 결정 기한을 나눠 적으세요. 수치를 모르면 추측해서 채우지 말고 확인할 사람을 정하세요.\n마칠 때는 “다음 상담 전까지 누가 무엇을 확인할까요?”라고 묻고 과제 하나만 합의하세요. 공개 채팅에는 고객 이름이나 거래 원본 대신 기간별 합계만 쓰세요."},{"id":"followup-consult","title":"두 번째 상담: 지난 과제에서 결정으로 넘어가기","keywords":["두 번째 상담","2차 상담","후속 상담","재상담","실행 점검","상담 결과"],"text":"지난번에 약속한 과제와 그 과제로 답하려던 질문을 먼저 읽어 보세요. 했다면 기대와 실제 결과를 나란히 적고, 못 했다면 자료 부족인지 담당자 부재인지 원인을 물으세요.\n선택지 두 개를 비용, 걸리는 시간, 되돌리기 어려운 점으로 비교하세요. 예컨대 전면 변경 대신 일부 주문에만 새 절차를 적용할 수 있는지 보세요.\n결론은 실행·보류·중단 중 하나로 기록하세요. 실행이면 담당자와 점검일을, 보류라면 어떤 정보가 있어야 다시 결정할지 남기세요."},{"id":"cash-calendar","title":"매출은 있는데 잔액이 부족할 때","keywords":["현금흐름","현금 흐름","잔고","잔액","자금일보","자금 부족","입금일","운전자금"],"text":"오늘 바로 쓸 수 있는 현금에서 시작해 앞으로 네 주를 한 줄씩 그리세요. 판매한 날이 아니라 실제로 받을 날에 입금을, 지급하기로 한 날에 임차료·급여·매입대금·원리금을 적으세요.\n각 주의 끝 잔액은 시작 잔액에 입금을 더하고 출금을 뺀 값입니다. 날짜가 불확실한 큰 입금은 한 주 밀린 경우도 계산하세요. 주중에 큰 지급이 있으면 그 주만 날짜별로 다시 보세요.\n처음 모자라는 날과 금액을 표시하고, 오늘 확인할 입금 한 건이나 상대와 미리 협의할 지급 일정 한 건을 고르세요."},{"id":"collections","title":"미수금: 독촉 전에 입금이 막힌 이유 찾기","keywords":["미수금","외상","매출채권","연체","수금","대금 회수"],"text":"거래별로 청구 금액, 약정일, 실제 입금액, 남은 금액을 적고 아직 기한이 안 된 건을 분리하세요. 차이가 있으면 청구서뿐 아니라 반품·부분 입금·상계 합의가 있었는지 확인하세요.\n기한이 지난 건은 “청구 내용 중 확인이 필요한 부분과 지급 예정일을 알려 주실 수 있을까요?”라고 물으세요. 서류 누락이면 다시 보내고, 금액 다툼이면 이견이 있는 부분을 따로 적으세요.\n새로 합의한 날짜와 다음 연락일을 기록하세요. 회신이 없다고 임의로 연체료를 붙이지 말고 계약 조건을 먼저 확인하세요."},{"id":"unit-economics","title":"손익분기점: 한 건을 더 팔 때 얼마가 남는지 보기","keywords":["손익분기점","마진","원가","공헌이익","고정비","적자","수익성"],"text":"대표 상품 하나의 실판매가에서 할인액을 이중으로 빼지 않았는지 확인하세요. 그 금액에서 판매할 때마다 드는 재료비·포장비·결제 비용 등을 빼면 한 건이 고정비를 충당하는 데 보탤 금액이 나옵니다.\n이 금액이 양수이고 같은 상품만 판다고 가정하면 월 고정비를 이 금액으로 나누고 올림한 값이 필요한 판매 건수입니다. 영업일로 다시 나눈 뒤 하루 처리 능력과 비교하세요.\n한 건을 팔아도 남는 돈이 없다면 건수를 늘리는 계산부터 하지 마세요. 여러 상품을 함께 팔면 상품별 판매 비중을 반영해 다시 계산하세요."},{"id":"funding-needs","title":"자금 조달: 얼마를 왜 빌릴지 정하기","keywords":["자금 조달","대출","차입","사업 자금","운영 자금","시설 자금","융자"],"text":"견적과 지급일을 기준으로 용도별 필요액을 적으세요. 설비처럼 한 번 나가는 돈과 재료 매입처럼 계속 필요한 돈을 나누고, 당장 쓸 수 있는 자기 자금에서 운영에 남겨 둘 몫을 빼세요.\n견적의 분할 지급이나 구매 연기로 부족액을 줄일 수 있는지 먼저 확인하세요. 그래도 빌려야 한다면 원금과 이자가 빠지는 날을 현금 달력에 넣고 매출이 늦게 들어오는 달에도 잔액이 남는지 보세요.\n상담에는 용도·부족액·필요일·상환 재원을 한 장으로 가져가세요. 이 계산만으로 승인 여부나 실제 한도를 알 수는 없습니다."},{"id":"funding-terms","title":"조달 조건을 같은 기준으로 비교하기","keywords":["상환","대출 비교","금융 조건","거치","보증","담보","중도상환","이자"],"text":"필요한 실수령액과 사용 기간을 먼저 정하세요. 각 제안에 대해 처음 손에 들어오는 돈, 계약 때 별도로 낼 돈, 매달 빠질 돈, 마지막에 남는 원금을 같은 달력에 옮기세요.\n초기 부담이 작은 안은 원금 상환이 시작된 뒤 가장 많이 내는 달도 확인하세요. 조기 상환, 조건 변경, 담보나 보증을 요구하는 범위는 서면으로 물어보세요.\n같은 비용을 수령액과 지급액에 두 번 반영하지 마세요. 확인되지 않은 항목은 ‘없음’이 아니라 ‘미확인’으로 두고 서명 전에 답을 받으세요."},{"id":"support-review","title":"지원사업: 신청 전에 확인할 문장 찾기","keywords":["지원금","지원사업","정책자금","신청","자격","공고","보조금"],"text":"관심 있는 사업의 개별 공고와 변경 안내에서 대상 판단 기준일, 제외 대상, 접수 마감, 사용할 수 있는 항목을 찾아 적으세요. 갚아야 하는 자금인지, 지출 후 정산받는 돈인지도 구분하세요.\n준비할 표는 ‘공고 문구 / 우리 상황 / 확인 자료 / 남은 질문’ 네 칸이면 됩니다. 자부담과 선지출이 있다면 실제 지출일부터 정산 예상일까지 버틸 현금을 따져 보세요.\n애매한 요건은 해당 문구를 인용해 접수 창구에 문의하세요. 일반 안내만으로 현재 접수 여부, 자격 또는 선정을 단정하지 마세요."},{"id":"hire-or-redesign","title":"첫 채용: 사람을 뽑기 전에 맡길 일 정하기","keywords":["채용","구인","직원","첫 채용","인건비","일손","업무 분담"],"text":"바빴던 날 하나를 골라 밀린 업무, 걸린 시간, 기다린 사람을 적으세요. 계속 생기는 일인지 일시적인 몰림인지 나누고, 순서 변경이나 예약 분산으로 해결될 일은 먼저 시험하세요.\n그래도 채용이 필요하면 “누가 빠져도 주문 마감표가 제때 완성된다”처럼 입사 후 맡길 결과를 한 문장으로 쓰세요. 급여 외에 교육 시간, 장비, 사업주 부담 비용까지 현금 계획에 반영하세요.\n면접에서는 같은 업무 상황을 제시해 확인해야 할 점과 작업 순서를 물으세요. 공고를 내기 전 근무 형태에 맞는 조건과 의무는 별도로 확인하세요."},{"id":"onboarding","title":"새 직원에게 일을 넘기는 첫 주","keywords":["온보딩","신입","교육","인수인계","업무 매뉴얼","적응"],"text":"첫 주에 혼자 마칠 업무 하나를 고르고 완료 기준을 보여 주세요. 주문 접수라면 “수량·납기 확인 후 접수 상태까지 변경”처럼 어디까지가 끝인지 적으세요.\n첫 건은 담당자가 설명하며 하고, 다음 건은 새 직원이 설명하며 해 보게 하세요. 예외 상황은 직접 처리할 범위와 도움을 요청할 기준으로 나누세요. 연습에는 가상 주문을 쓰세요.\n퇴근 전 자주 막힌 부분 한 곳을 함께 고쳐 안내문에 반영하세요. 계정 접근은 업무에 필요한 범위만 부여하고 비밀번호를 함께 쓰지 마세요."},{"id":"purchase-review","title":"사업체 인수: 무엇을 넘겨받는지 확인하기","keywords":["사업체 인수","사업 양수","양도양수","가게 인수","권리금","실사","매물"],"text":"먼저 시설·재고·상호·온라인 판매 채널·계약·채무를 나열하고 각각 ‘포함 / 제외 / 동의 필요 / 미확인’으로 표시하세요. 자산을 사는지 회사 지분을 사는지도 구분하세요.\n같은 기간의 판매 기록과 실제 정산을 맞춰 보고, 일회성 주문이나 기존 대표가 무급으로 해 온 업무는 따로 표시하세요. 임대차와 주요 거래가 새 운영자에게 그대로 이어진다고 가정하지 마세요.\n대금을 약속하기 전에 미확인 항목별로 필요한 증빙과 확인 기한을 적으세요. 채무 승계와 계약 효력은 거래 구조에 따라 달라질 수 있어 개별 검토가 필요합니다."},{"id":"takeover-handover","title":"인수 첫날: 영업이 끊기지 않도록 인계받기","keywords":["인수 후","인계","매장 인수","영업 인계","선수금","예약","재고 인계"],"text":"인수 기준 시각을 정하고 그때 남은 재고·예약·선수금·반품 요청을 함께 대조하세요. 이미 돈을 받은 주문은 누가 서비스를 제공하고 누가 환불을 부담할지 기록하세요.\n영업을 이어 갈 열쇠, 장비, 거래처 연락 절차, 판매 채널별 권한을 점검하세요. 비밀번호나 고객 명단을 통째로 넘겨받는 대신 허용된 권한 이전과 정보 처리 절차를 확인하세요.\n가상 주문 한 건으로 접수부터 마감까지 새 운영자가 직접 따라가 보세요. 해결되지 않은 항목에는 상대 담당자와 확인일을 남기세요."},{"id":"pricing","title":"가격을 바꾸기 전 작은 범위에서 검증하기","keywords":["가격","가격 인상","단가","할인","가격 책정","요금제"],"text":"가격을 바꾸려는 이유가 원가 상승인지, 제공 범위가 늘어서인지 한 줄로 적으세요. 기존 주문 한 건에서 받은 금액과 실제 투입 시간·비용을 계산해 기준을 만드세요.\n신규 견적처럼 조건을 명확히 알릴 수 있는 범위를 정하고 구성이나 가격 중 하나만 바꿔 보세요. 문의 수, 수락 건수, 주문당 남는 금액과 거절 이유를 함께 기록하세요.\n거래 건수가 적다면 한 건의 거절로 결론 내리지 마세요. 기존 계약이나 예약은 약속한 가격과 변경 조건을 먼저 확인하세요."},{"id":"sales-bottleneck","title":"문의는 오는데 주문이 적을 때","keywords":["영업","매출","고객 문의","전환","견적","구매","계약 성사"],"text":"최근 같은 기간에 들어온 문의를 모아 문의·견적 발송·결정·입금 단계별로 몇 건인지 세세요. 아직 답을 기다리는 건과 실제 거절을 나누고, 중복 문의는 한 건으로 묶으세요.\n가장 자주 멈춘 단계에서 이유를 한 문장씩 적어 보세요. 견적 뒤 납기 질문이 반복됐다면 다음 견적에는 제공 범위와 가장 이른 납품일을 함께 적으세요.\n다음 묶음의 비슷한 문의와 비교할 때는 이 한 가지만 바꾸세요. 문의 경로나 상품 구성이 달라졌다면 개선 효과로 단정하지 마세요."},{"id":"inventory","title":"잘 팔리는데 재고에 돈이 묶일 때","keywords":["재고","발주","매입","품절","재고 관리","납기","폐기"],"text":"품목 하나를 골라 장부 수량과 실제 쓸 수 있는 수량을 맞추세요. 파손품과 이미 예약된 수량은 새 주문에 쓸 수 있는 재고에서 제외하세요.\n최근 평소 판매량과 가장 늦었던 납품일을 바탕으로 다음 입고까지 필요한 양을 추산하세요. 확정된 입고가 언제 도착하는지도 표시해 같은 물량을 다시 주문하지 않도록 하세요.\n행사 때만 많이 나간 품목은 평소 수요와 분리하세요. 묶음 매입 할인은 결제일, 보관 공간, 남은 재고의 처리 비용까지 적어 본 뒤 결정하세요."},{"id":"owner-delegation","title":"대표에게만 일이 몰릴 때: 한 가지 결정부터 위임하기","keywords":["위임","대표","결재","권한","승인","업무 병목"],"text":"지난주 대표가 답할 때까지 멈춘 일을 적고, 자주 반복되며 잘못돼도 바로 고칠 수 있는 결정 하나를 고르세요. 배송일 조정이라면 바꿀 수 있는 범위와 고객에게 먼저 확인할 내용을 정하세요.\n안내문에는 ‘스스로 결정 / 결정 후 공유 / 먼저 승인’의 예를 한 가지씩 넣으세요. 담당자와 가상 상황을 두세 건 풀어 보며 판단이 갈린 문장을 고치세요.\n다음 점검 때 대기 시간과 되돌린 결정 건수를 같이 보세요. 큰 계약이나 환불처럼 손실을 되돌리기 어려운 일까지 한꺼번에 넘기지 마세요."},{"id":"proposal-scope","title":"상담 내용을 실행 가능한 제안서로 바꾸기","keywords":["제안서","견적서","서비스 범위","결과물","상담 제안","용역"],"text":"첫 문장에는 고객이 결정하려는 일을 적으세요. ‘운영 개선’보다 ‘다음 발주 전에 품목별 주문량을 결정한다’가 결과물을 정하기 쉽습니다.\n업무별로 누가 어떤 자료를 받아 무엇을 언제 넘기는지 쓰세요. 고객이 제공할 자료, 검수 기준, 수정 횟수, 포함되지 않는 업무, 추가 비용이 생기는 조건도 구분하세요.\n끝에는 총비용과 지급 시점, 다음에 확인할 한 가지 결정을 적으세요. 납품할 수 있는 표나 점검 결과와 통제할 수 없는 매출·승인 결과를 구분해 약속하세요."},{"id":"lease-decision","title":"점포 계약: 월세 외에 빠져나갈 돈 확인하기","keywords":["임대차","점포","매장 계약","보증금","월세","이전","입지"],"text":"후보지마다 계약 때 묶이는 보증금, 열기 전 공사·설비비, 매달 낼 임차료와 관리비, 나갈 때의 복구비를 시점별로 적으세요. 돌려받을 것으로 기대하는 돈은 반환 조건과 시점을 확인할 때까지 운영비로 잡지 마세요.\n원하는 영업 시간대에 현장을 보고 전력·배수·배송 동선처럼 내 업종에 필요한 조건을 체크하세요. 영업 가능 여부와 공사 동의는 구두 설명만 믿지 말고 확인할 곳과 서류를 적으세요.\n계약 전 미확인 항목에 답을 받고, 개점이 늦어져도 감당할 수 있는지 현금 계획을 다시 보세요."}];
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[^가-힣a-z0-9]/g,'');
const atom=s=>(String(s).normalize('NFKC').toLowerCase().match(/[가-힣a-z0-9]+/g)||[]).filter(x=>x.length>1);
const terms=s=>new Set(atom(s).flatMap(w=>[...new Set([w,...Array.from({length:w.length-1},(_,i)=>w.slice(i,i+2))])]));
const gs=guides.map(g=>({...g,t:terms(g.title+' '+g.keywords.join(' ')),b:terms(g.text)}));
const idf=new Map;for(const g of gs)for(const x of g.t)idf.set(x,1+(idf.get(x)||0));
function score(q,g){const n=norm(q),keys=g.keywords.map(norm).filter(k=>k.length>=2),k=Math.max(0,...keys.filter(k=>n.includes(k)).map(k=>Math.min(8,k.length)*1.7));let t=0,b=0;for(const w of terms(q)){const v=Math.log((gs.length+1)/((idf.get(w)||0)+1));if(g.t.has(w))t+=v;else if(g.b.has(w))b+=.15*v;}return k+Math.min(14,t)+Math.min(2,b);}

const rank=q=>gs.map(g=>({g,s:score(expand(q),g)})).sort((a,b)=>b.s-a.s);

const a=q.match(/고정비(?:용)?\s*(?:가|는|:|=)?\s*([0-9][0-9,.]*)\s*(억|만|천)?\s*원/),b=q.match(/(변동비율|공헌이익률)\s*(?:이|은|:|=)?\s*([0-9.]+)\s*%/);

if(/손익분기/.test(n)&&/(계산|얼마|구해)/.test(n))return result('같은 기간의 고정비와 변동비율을 알려주세요. 예: “월 고정비 300만원, 변동비율 40%면 손익분기 매출이 얼마예요?”');
const follow=/^(더자세히|구체적으로|그다음|다음단계|예시|예를들|체크리스트|먼저할일|첫단계|한줄|요약|어떤자료|준비물|그럼뭐부터|무엇부터|뭐부터)/.test(n)&&n.length<24;
let choices=rank(q);if(follow&&previousQuestion&&(choices[0].s<9||n.length<9))choices=rank(previousQuestion);
if(choices[0].s<5.2)return result('공개 가이드에서 바로 답할 내용을 찾지 못했어요. 첫 상담 준비, 현금흐름, 자금조달, 채용처럼 궁금한 경영 주제를 넣어 다시 물어봐 주세요.');
const best=choices[0].g,lines=sequence(best).split(/\n+/).filter(Boolean);let ans=sequence(best);
if(follow&&previousQuestion){if(/요약|한줄/.test(n))ans=lines[0];else if(/다음|먼저|뭐부터|무엇부터|첫단계/.test(n))ans='지금 해볼 일\n'+(lines.length>1?lines.slice(0,2).join('\n\n'):ans);else ans='확인할 순서\n'+lines.map((v,i)=>`${i+1}. ${v}`).join('\n\n');}
if(/승인될|승인가능|대출한도|지원대상인가|승인확률/.test(n))ans='이 챗봇은 승인 여부나 한도를 판정하지 않아요.\n\n'+ans;
return result(ans,[best]);
};})();

<div class="dock"><form class="compose" id="form" autocomplete="off"><label class="sr" for="question">경영인코치에게 질문하기</label><div class="field"><textarea rows="1" id="question" enterkeyhint="send" placeholder="궁금한 점을 입력하세요" aria-describedby="privacy shortcuts"></textarea><button type="submit" class="send" id="send" aria-label="질문 보내기" disabled><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></button></div><div class="tip"><span id="privacy">이름이나 연락처 등 개인정보는 입력하지 마세요.</span><span class="shortcut" id="shortcuts">Enter 전송 · Shift+Enter 줄바꿈</span></div></form></div></main></div>

<script>
'use strict';
const el=id=>document.getElementById(id),box=el('question'),send=el('send'),log=el('log'),scroller=el('scroll');
let previousQuestion='',active=null,composing=false;
function fit(){box.style.height='auto';box.style.height=Math.min(110,box.scrollHeight)+'px';send.disabled=!!active||!box.value.trim()}
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function message(who,text,cls=''){const item=node('div','msg '+cls);item.append(node('span','who',who),node('div','bubble',text));return item}
function sources(list){if(!Array.isArray(list))return null;const valid=list.filter(s=>s&&typeof s.title==='string'&&typeof s.text==='string');if(!valid.length)return null;const details=node('details','refs'),ol=node('ol');details.append(node('summary','',`참고한 공개 가이드 ${valid.length}개`),ol);for(const s of valid){const li=node('li');li.append(node('strong','',s.title),node('p','',s.text));ol.append(li)}return details}
async function serverReply(question,previousQuestion,signal){const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({question,previousQuestion}),signal,cache:'no-store'});const data=await res.json().catch(()=>null);if(!res.ok)throw new Error(typeof data?.error==='string'?data.error:'답변을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');return data}
const localEngine=typeof window.coachReply==='function';if(localEngine){el('mode').textContent='브라우저에서 답변 · 대화 미저장';el('privacy').textContent='대화는 저장되지 않아요. 개인정보는 입력하지 마세요.'}
async function ask(raw){const question=raw.trim();if(!question||active)return;const request=new AbortController();active=request;el('status').textContent='';el('intro').hidden=true;el('thread').hidden=false;box.value='';fit();const mine=message('내 질문',question,'me'),pending=message('경영인코치','공개 가이드를 확인하고 있어요.','pending');log.append(mine,pending);scroller.scrollTop=scroller.scrollHeight;const timer=setTimeout(()=>request.abort(),45000);try{const data=localEngine?await window.coachReply(question, previousQuestion):await serverReply(question,previousQuestion,request.signal);if(data?.error||typeof data?.answer!=='string'||!data.answer.trim()){throw new Error(typeof data?.error==='string'?data.error:'답변을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.')}if(active!==request)return;const reply=message('경영인코치',data.answer),refs=sources(data.sources);if(refs)reply.append(refs);const nearEnd=scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<130;pending.replaceWith(reply);previousQuestion=question;if(nearEnd)scroller.scrollTop=reply.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop-12}catch(err){if(active!==request)return;const text=err.name==='AbortError'?'답변 시간이 길어지고 있어요. 잠시 후 다시 시도해 주세요.':err instanceof TypeError?'연결을 확인한 뒤 다시 시도해 주세요.':err.message;const failed=message('응답 오류',text,'fail'),retry=node('button','reset','다시 묻기');retry.type='button';retry.addEventListener('click',()=>{if(!active){retry.remove();void ask(question)}});failed.append(retry);pending.replaceWith(failed)}finally{clearTimeout(timer);if(active===request){active=null;fit()}}}
el('form').addEventListener('submit',e=>{e.preventDefault();if(!composing)void ask(box.value)});box.addEventListener('input',fit);box.addEventListener('compositionstart',()=>composing=true);box.addEventListener('compositionend',()=>composing=false);box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!composing&&!e.isComposing&&e.keyCode!==229){e.preventDefault();void ask(box.value)}});
for(const card of document.querySelectorAll('.card'))card.addEventListener('click',()=>{el('reset').focus({preventScroll:true});void ask(card.querySelector('.cq').textContent)});
el('reset').addEventListener('click',()=>{if((log.childElementCount||box.value)&&!window.confirm('이 화면의 대화와 입력한 질문을 지울까요?'))return;active?.abort();active=null;previousQuestion='';log.replaceChildren();box.value='';fit();el('thread').hidden=true;el('intro').hidden=false;scroller.scrollTop=0;el('status').textContent='대화를 초기화했어요.'});
function sizeViewport(){if(window.visualViewport&&Math.abs(window.visualViewport.scale-1)<0.01)document.documentElement.style.setProperty('--screen',window.visualViewport.height+'px')}
window.visualViewport?.addEventListener('resize',sizeViewport);sizeViewport();fit();
